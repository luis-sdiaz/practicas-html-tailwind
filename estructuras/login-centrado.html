<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- ========================================== -->
  <!-- TARJETA CONTENEDORA CENTRADA               -->
  <!-- ========================================== -->
  <div class="w-full max-w-md bg-white rounded-3xl border border-stone-200 shadow-xl p-8 flex flex-col gap-6">

    <!-- 1. Cabecera de la tarjeta: Logo y textos -->
    <div class="flex flex-col items-center text-center gap-2">
      <!-- Icono o Logo circular -->
      <div class="w-12 h-12 bg-orange-600 rounded-2xl flex items-center justify-center text-white text-xl font-black shadow-md">
        🍕
      </div>
      <h1 class="text-2xl font-black uppercase text-stone-900 tracking-tight">
        Bienvenido
      </h1>
      <p class="text-xs text-stone-500">
        Ingresa tus credenciales para acceder a tu cuenta
      </p>
    </div>

    <!-- 2. Formulario -->
    <form class="flex flex-col gap-4">

      <!-- Campo: Correo -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold uppercase tracking-wider text-stone-700">
          Correo Electrónico
        </label>
        <input 
          type="email" 
          placeholder="usuario@ejemplo.com"
          class="w-full px-4 py-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs text-stone-800 placeholder-stone-400 focus:outline-none focus:border-orange-600 focus:bg-white transition"
          required
        >
      </div>

      <!-- Campo: Contraseña -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold uppercase tracking-wider text-stone-700">
            Contraseña
          </label>
          <a href="#" class="text-[11px] font-semibold text-orange-600 hover:underline">
            ¿Olvidaste tu clave?
          </a>
        </div>
        <input 
          type="password" 
          placeholder="••••••••"
          class="w-full px-4 py-2.5 bg-stone-50 border border-stone-300 rounded-xl text-xs text-stone-800 placeholder-stone-400 focus:outline-none focus:border-orange-600 focus:bg-white transition"
          required
        >
      </div>

      <!-- Checkbox: Recordarme -->
      <div class="flex items-center gap-2">
        <input type="checkbox" id="recordar" class="w-4 h-4 rounded border-stone-300 text-orange-600 accent-orange-600">
        <label for="recordar" class="text-xs text-stone-600 select-none">
          Recordar este dispositivo
        </label>
      </div>

      <!-- Botón Principal -->
      <button 
        type="submit" 
        class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-md transition-colors mt-2"
      >
        Ingresar a la plataforma
      </button>

    </form>

    <!-- 3. Pie de la tarjeta: Registro alternativo -->
    <div class="text-center text-xs text-stone-500 pt-2 border-t border-stone-100">
      ¿No tienes una cuenta aún? 
      <a href="#" class="font-bold text-orange-600 hover:underline">
        Regístrate aquí
      </a>
    </div>

  </div>

</body>
</html>
