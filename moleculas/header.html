<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moléculas - Headers y Navegación</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 p-8 flex flex-col gap-10 font-sans text-stone-800">

  <!-- ============================================================== -->
  <!-- 1. HEADER TIPO E-COMMERCE / TIENDA (Buscador central + Carrito)-->
  <!-- ============================================================== -->
  <section class="flex flex-col gap-2">
    <span class="text-xs font-black uppercase tracking-wider text-orange-600">Variante 1: Tienda / E-Commerce</span>
    <header class="w-full bg-white border border-stone-200 rounded-2xl px-6 py-3 shadow-sm flex items-center justify-between gap-4">
      
      <!-- Logo + Marca -->
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 bg-stone-900 text-white rounded-xl flex items-center justify-center font-black text-sm">
          ★
        </div>
        <span class="font-black text-sm tracking-tight text-stone-900 uppercase">BrandStore</span>
      </div>

      <!-- Buscador central con icono -->
      <div class="flex-1 max-w-md relative hidden md:block">
        <span class="absolute left-3.5 top-2.5 text-stone-400 text-xs">🔍</span>
        <input 
          type="text" 
          placeholder="Buscar productos, marcas o categorías..." 
          class="w-full pl-9 pr-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-xs text-stone-800 placeholder-stone-400 focus:outline-none focus:bg-white focus:border-stone-400 transition"
        >
      </div>

      <!-- Acciones: Carrito con badge + Botón Ingresar -->
      <div class="flex items-center gap-4">
        <button class="relative p-2 text-stone-600 hover:text-stone-900 transition">
          <span class="text-base">🛒</span>
          <span class="absolute top-1 right-1 w-4 h-4 bg-orange-600 text-white rounded-full text-[9px] font-black flex items-center justify-center">
            3
          </span>
        </button>
        <button class="px-4 py-2 bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold rounded-xl transition shadow-sm">
          Mi Cuenta
        </button>
      </div>

    </header>
  </section>

  <!-- ============================================================== -->
  <!-- 2. HEADER TIPO LANDING / SAAS (Links centrales + Botón CTA)    -->
  <!-- ============================================================== -->
  <section class="flex flex-col gap-2">
    <span class="text-xs font-black uppercase tracking-wider text-stone-500">Variante 2: Landing Page / Corporativo</span>
    <header class="w-full bg-white border border-stone-200 rounded-2xl px-6 py-4 shadow-sm flex items-center justify-between">
      
      <!-- Logo -->
      <a href="#" class="font-black text-base uppercase tracking-tight text-stone-900 flex items-center gap-2">
        <span class="w-2.5 h-2.5 bg-blue-600 rounded-full"></span>
        NexusApp
      </a>

      <!-- Menú de enlaces centrado -->
      <nav class="hidden md:flex items-center gap-8 text-xs font-semibold text-stone-600">
        <a href="#" class="text-stone-900 font-bold transition">Características</a>
        <a href="#" class="hover:text-stone-900 transition">Soluciones</a>
        <a href="#" class="hover:text-stone-900 transition">Precios</a>
        <a href="#" class="hover:text-stone-900 transition">Recursos</a>
      </nav>

      <!-- Botones de acceso -->
      <div class="flex items-center gap-3">
        <a href="#" class="text-xs font-bold text-stone-700 hover:text-stone-900 px-3 py-2">
          Iniciar sesión
        </a>
        <button class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-sm transition">
          Prueba Gratis
        </button>
      </div>

    </header>
  </section>

  <!-- ============================================================== -->
  <!-- 3. HEADER INTERNO DE DASHBOARD (Título + Notificación + Perfil) -->
  <!-- ============================================================== -->
  <section class="flex flex-col gap-2">
    <span class="text-xs font-black uppercase tracking-wider text-stone-500">Variante 3: Barra Superior de Panel / Dashboard</span>
    <header class="w-full bg-white border border-stone-200 rounded-2xl px-6 py-3 shadow-sm flex items-center justify-between">
      
      <!-- Título de la vista actual -->
      <div>
        <h2 class="text-base font-black text-stone-900 leading-tight">Panel Principal</h2>
        <span class="text-[10px] text-stone-400 font-medium">Bienvenido de nuevo, revisa tus métricas</span>
      </div>

      <!-- Notificaciones y Chip de Perfil -->
      <div class="flex items-center gap-4">
        
        <!-- Campana con alerta roja -->
        <button class="relative w-8 h-8 rounded-lg bg-stone-50 border border-stone-200 flex items-center justify-center text-xs text-stone-600 hover:bg-stone-100 transition">
          🔔
          <span class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full"></span>
        </button>

        <!-- Chip de Perfil -->
        <div class="flex items-center gap-2.5 pl-2 border-l border-stone-200 cursor-pointer">
          <div class="w-8 h-8 rounded-full bg-stone-900 text-white flex items-center justify-center font-bold text-xs shadow-sm">
            JD
          </div>
          <div class="hidden sm:flex flex-col">
            <span class="text-xs font-bold text-stone-800 leading-tight">Juan Díaz</span>
            <span class="text-[10px] text-stone-400">Administrador</span>
          </div>
          <span class="text-[9px] text-stone-400">▼</span>
        </div>

      </div>

    </header>
  </section>

</body>
</html>
